<!doctype html><meta charset="utf-8"><title>War Room</title>
<style>
 :root{--paper:#e8e2d6;--stone:#8a8177;--blood:#8c2f22;--gold:#b8862f}
 *{box-sizing:border-box}
 body{margin:0;background:#141210;color:var(--paper);
      font:13px/1.5 ui-monospace,"DejaVu Sans Mono",monospace;display:flex;height:100vh;overflow:hidden}
 #left{padding:16px 18px;width:270px;border-right:1px solid #2e2a25;overflow:auto;flex:none}
 #right{flex:1;display:flex;flex-direction:column;overflow:auto;padding:14px}
 h1{font-size:14px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 2px;color:var(--gold)}
 .sub{color:var(--stone);font-size:11px;margin-bottom:14px}
 .k{color:var(--stone);font-size:10px;margin:14px 0 5px;letter-spacing:.12em;text-transform:uppercase}
 .tool{display:block;width:100%;text-align:left;margin:2px 0;padding:6px 9px;background:#1e1b18;
       border:1px solid #322d27;color:var(--paper);cursor:pointer;font:inherit;font-size:12px}
 .tool:hover{border-color:var(--gold)} .tool.on{background:#2b241a;border-color:var(--gold);color:var(--gold)}
 #hbox{display:flex;align-items:center;gap:8px;margin-top:6px}
 #hbox input{width:54px;background:#1e1b18;border:1px solid #322d27;color:var(--gold);
             font:inherit;padding:5px 7px;text-align:center}
 button.go{width:100%;padding:9px;margin-top:14px;background:var(--blood);border:0;color:#f4ece0;
           font:inherit;letter-spacing:.12em;cursor:pointer;text-transform:uppercase}
 #out{margin-top:12px;white-space:pre-wrap;font-size:12px;border-top:1px solid #2e2a25;padding-top:10px}
 .big{font-size:24px;color:var(--gold)}
 #credits{font-size:11px;color:var(--stone)} #credits b{color:var(--gold)}
 .pane{margin-bottom:8px} .lab{font-size:10px;color:var(--stone);letter-spacing:.12em;
       text-transform:uppercase;margin-bottom:5px}
 .rowline{display:flex} .axis{width:19px;height:19px;font-size:9px;color:#5d564e;
       letter-spacing:-.5px;
       display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
 .axis:hover,.axis.sel{color:var(--gold)}
 .rowline>.axis:first-child{width:26px;justify-content:flex-end;padding-right:5px}
 #side .axis{width:23px} #side .rowline>.axis:first-child{width:26px}
 .c{width:19px;height:19px;flex:none;background:#191715;display:flex;align-items:center;
    justify-content:center;font-size:10px;border:1px solid #211e1b;cursor:crosshair;user-select:none}
 .c.path{outline:1px solid var(--blood);outline-offset:-3px}
 .c.exp{box-shadow:inset 0 0 0 19px rgba(140,47,34,.18)}
 #side .c{width:23px;height:23px;font-size:11px}
 #side .ground{border-bottom:2px solid #4a443c}
</style>
<div id="left">
 <h1>War Room</h1><div class="sub">Design. Seal. Learn what they saw.</div>
 <div class="k">Block</div><div id="t1"></div>
 <div id="hbox"><span style="color:var(--stone);font-size:11px">height</span>
   <input id="hgt" type="number" min="1" max="12" value="3"></div>
 <div class="k">Posts &amp; anchors</div><div id="t2"></div>
 <div class="k">Blood budget</div><div id="credits"></div>
 <button class="go" onclick="seal()">Seal &amp; send them in</button>
 <div id="out"></div>
</div>
<div id="right">
 <div class="pane"><div class="lab">Plan — click an edge index to slice</div><div id="top"></div></div>
 <div class="pane"><div class="lab" id="sidelab">Section — none selected</div><div id="side"></div></div>
</div>
<script>
const W=24,H=24,MAXZ=8;
// cells[y][x] = array of block chars, bottom -> top.  ents["x,y"] = char
let cells=[...Array(H)].map(()=>[...Array(W)].map(()=>[])), ents={};
const BLOCK={"#":["Stone",  "#4b463f"], "=":["Palisade","#4a3a22"],
             "G":["Gate",   "#6b4a24"], "D":["Door",    "#8a5f2c"]};
const POST ={"A":["Archer (1cr)","#c9a227"], "m":["Watchman (1cr)","#7fa0c0"],
             "r":["Messenger route (1cr)","#6f8f6f"],
             "T":["War room","#d8cdb6"], "S":["Their camp","#a35043"]};
let cur="#", curKind="block", sel=null;

function mkTool(box,ch,label,kind){
  const b=document.createElement("button");b.className="tool";b.textContent=label;
  b.onclick=()=>{cur=ch;curKind=kind;
    [...document.querySelectorAll(".tool")].forEach(x=>x.classList.remove("on"));b.classList.add("on");};
  document.getElementById(box).appendChild(b);return b;}
for(const [ch,[n]] of Object.entries(BLOCK))mkTool("t1",ch,n,"block");
mkTool("t1","x","Clear column","block");
for(const [ch,[n]] of Object.entries(POST))mkTool("t2",ch,n,"ent");
document.querySelector(".tool").classList.add("on");

function stackH(x,y){return cells[y][x].length}
function topChar(x,y){const s=cells[y][x];return s.length?s[s.length-1]:null}

function paintTop(x,y){
  if(curKind==="ent"){
    if("TS".includes(cur))for(const k in ents)if(ents[k]===cur)delete ents[k];
    const k=x+","+y; ents[k]===cur?delete ents[k]:ents[k]=cur;
  }else if(cur==="x"){cells[y][x]=[];}
  else{const n=Math.max(1,Math.min(MAXZ,+document.getElementById("hgt").value||1));
       cells[y][x]=Array(n).fill(cur);}
  drawTop(); if(sel)drawSide();}

let down=false; document.addEventListener("mouseup",()=>down=false);

function drawTop(){
  const box=document.getElementById("top");box.innerHTML="";
  const hdr=document.createElement("div");hdr.className="rowline";
  hdr.appendChild(Object.assign(document.createElement("div"),{className:"axis"}));
  for(let x=0;x<W;x++){const a=document.createElement("div");a.className="axis"+
      (sel&&sel[0]==="x"&&sel[1]===x?" sel":"");a.textContent=x;a.title="column x="+x;
    a.onclick=()=>{sel=["x",x];drawTop();drawSide()};hdr.appendChild(a);}
  box.appendChild(hdr);
  for(let y=0;y<H;y++){
    const line=document.createElement("div");line.className="rowline";
    const a=document.createElement("div");a.className="axis"+
      (sel&&sel[0]==="y"&&sel[1]===y?" sel":"");a.textContent=y;a.title="row y="+y;
    a.onclick=()=>{sel=["y",y];drawTop();drawSide()};line.appendChild(a);
    for(let x=0;x<W;x++){
      const d=document.createElement("div");d.className="c";
      const h=stackH(x,y),e=ents[x+","+y];
      if(h){const t=topChar(x,y);d.style.background=BLOCK[t][1];
            d.style.filter=`brightness(${0.62+0.09*h})`;d.textContent=h;d.style.color="#0d0c0b";}
      if(e){d.textContent=e;d.style.color=POST[e][1];
            if(!h)d.style.background="#1d1a17";}
      if(sel&&((sel[0]==="x"&&sel[1]===x)||(sel[0]==="y"&&sel[1]===y)))
        d.style.borderColor="#4a4237";
      d.onmousedown=()=>{down=true;paintTop(x,y)};
      d.onmouseenter=()=>{if(down)paintTop(x,y)};
      line.appendChild(d);}
    box.appendChild(line);}
  credits();}

function drawSide(){
  const box=document.getElementById("side");box.innerHTML="";
  if(!sel){document.getElementById("sidelab").textContent="Section — none selected";return;}
  const [ax,i]=sel, n=ax==="x"?H:W;
  document.getElementById("sidelab").textContent=
    `Section ${ax}=${i} — looking along ${ax==="x"?"y":"x"} · click a block to edit`;
  for(let z=MAXZ;z>=1;z--){
    const line=document.createElement("div");line.className="rowline";
    const a=document.createElement("div");a.className="axis";a.textContent=z;line.appendChild(a);
    for(let j=0;j<n;j++){
      const x=ax==="x"?i:j, y=ax==="x"?j:i;
      const d=document.createElement("div");d.className="c"+(z===1?" ground":"");
      const st=cells[y][x], ch=st[z-1];
      if(ch){d.style.background=BLOCK[ch][1];d.textContent=ch==="#"?"":ch;d.style.color="#f0d9a8";}
      const e=ents[x+","+y];
      if(e&&z===st.length+1){d.textContent=e;d.style.color=POST[e][1];}
      d.onclick=()=>{
        if(curKind==="ent")return;
        if(cur==="x"){st.length=Math.max(0,z-1);}
        else{while(st.length<z-1)st.push("#"); st[z-1]=cur; st.length=Math.max(st.length,z);}
        drawTop();drawSide();};
      line.appendChild(d);}
    box.appendChild(line);}
  const foot=document.createElement("div");foot.className="rowline";
  foot.appendChild(Object.assign(document.createElement("div"),{className:"axis"}));
  for(let j=0;j<n;j++){const a=document.createElement("div");a.className="axis";
    a.textContent=j;foot.appendChild(a);}
  box.appendChild(foot);}

function credits(){
  const spent=Object.values(ents).filter(c=>"Amr".includes(c)).length;
  document.getElementById("credits").innerHTML=
    `<b>${250-spent}</b> of 250 unspent · ${spent} committed`;}

async function seal(){
  const out=document.getElementById("out");out.textContent="They are looking…";
  const res=await (await fetch("/",{method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({cells,ents,w:W,h:H})})).json();
  if(res.error){out.textContent="⚠ "+res.error;return;}
  drawTop();
  const rows=document.getElementById("top").children;
  const cell=(x,y)=>rows[y+1].children[x+1];
  res.exposure.forEach((row,y)=>row.forEach((v,x)=>{if(v>0)cell(x,y).classList.add("exp")}));
  res.path.forEach(([x,y])=>cell(x,y).classList.add("path"));
  const r=res.report;
  out.innerHTML=`<div class="big">${r.total}</div>`+
   `<div style="color:var(--stone);font-size:10px;margin-bottom:9px">TOTAL COST TO REACH YOU</div>`+
   `march ${r.travel} · breaching ${r.breach} · under fire ${r.exposure}\n`+
   `came in at: ${r.entries.length?r.entries.map(p=>`(${p[0]},${p[1]})`).join(" "):"nothing — they walked in"}\n\n`+
   `weighed and rejected:\n`+res.ranking.slice(1,4).map(([c,p])=>`  ${c} at (${p[0]},${p[1]})`).join("\n");}
drawTop();
</script>
